<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

<script src="https://www.paypal.com/sdk/js?client-id=AXWeUeNiGnGt6i3UkSImVHYO14dZbk3XVyM79uq9GH92ZseT2XLonzVj_6VhpnepJfCLUgOHCCrm-fJi&currency=USD"></script>

<body>
  <main>
    <div class="emoji">💵</div>
    <h1>Send Me One Dollar.</h1>
    <p class="blurb">I built a website. The website asks for a dollar. You're on the website.</p>
    <div id="paypal-button-container" onclick="gtag('event', 'click_pay_button', {'event_category': 'engagement', 'event_label': 'paypal_checkout', 'value': 1})"></div>
    <footer>That's it. That's the whole site.<br /><a href="/privacy.html" style="color: #888;">Privacy Policy</a></footer>
  </main>

  <script>
  paypal.Buttons({
    style: {
      layout: 'vertical',
      color: 'gold',
      shape: 'rect',
      label: 'pay'
    },
    createOrder: function(data, actions) {
      return actions.order.create({
        purchase_units: [{
          amount: {
            value: '1.00',
            currency_code: 'USD'
          },
          description: 'One dollar. Just because.'
        }]
      });
    },
    onApprove: function(data, actions) {
      return actions.order.capture().then(function(details) {
        document.getElementById('paypal-button-container').innerHTML =
          '<p style="color:#00c853;font-size:1rem;text-align:center;margin-top:1rem">✅ Thank you, ' +
          details.payer.name.given_name +
          '. You are a good person.</p>';
      });
    },
    onError: function(err) {
      document.getElementById('paypal-button-container').innerHTML =
        '<p style="color:#ff1744;font-size:0.85rem;text-align:center">' +
        'Something went wrong. Your dollar is safe.</p>';
    }
  }).render('#paypal-button-container');
  </script>
</body>
